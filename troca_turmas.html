<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Troca de Turmas — Life System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --teal:#00B4AC;--teal-dark:#009E96;--teal-deep:#007B74;
  --orange:#F5A623;--blue-dark:#1B3F72;--blue-mid:#2D6BE4;
  --green-ok:#27AE60;--green-bg:#E9F8EF;
  --red-err:#E53935;--red-bg:#FDECEA;
  --bg:#F0F4F8;--surface:#fff;--border:#E4EAF2;
  --text:#1A2535;--muted:#7B8FAB;--sidebar-w:240px;
  --font:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:linear-gradient(175deg,#00C9C1 0%,#007B74 55%,#00514D 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;}
.sb-logo{padding:26px 22px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,0.12);}
.sb-logo-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.sb-logo-text h1{font-size:13px;font-weight:700;color:#fff;}
.sb-logo-text p{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.07em;margin-top:2px;}
.sb-nav{flex:1;padding:18px 0;}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;transition:all 0.18s;position:relative;}
.sb-item:hover{color:#fff;background:rgba(255,255,255,0.07);}
.sb-item.active{color:#fff;background:rgba(255,255,255,0.14);font-weight:600;}
.sb-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#fff;border-radius:0 3px 3px 0;}
.sb-item svg{width:15px;height:15px;flex-shrink:0;}
.sb-back{margin:12px 18px 0;}
.btn-back{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);font-size:12px;font-weight:500;padding:9px 14px;border-radius:9px;cursor:pointer;font-family:var(--font);transition:all 0.18s;width:100%;}
.btn-back:hover{background:rgba(255,255,255,0.18);color:#fff;}
.btn-back svg{width:13px;height:13px;}

/* MAIN */
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 26px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
.topbar-left h2{font-size:16px;font-weight:700;}
.topbar-left p{font-size:11px;color:var(--muted);margin-top:1px;}
.topbar-right{display:flex;gap:10px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all 0.16s;}
.btn svg{width:13px;height:13px;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:var(--teal-dark);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--bg);color:var(--text);}

.content{padding:22px 26px;flex:1;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.stat-card{border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;right:-18px;bottom:-18px;width:80px;height:80px;border-radius:50%;opacity:0.12;background:#fff;}
.sc-t{background:var(--teal);color:#fff;}
.sc-o{background:var(--orange);color:#fff;}
.sc-b{background:var(--blue-dark);color:#fff;}
.stat-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.8;}
.stat-value{font-size:32px;font-weight:800;line-height:1;}
.stat-sub{font-size:10px;opacity:0.65;}

/* TOOLBAR */
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);}
.fg input,.fg select{height:36px;border:1.5px solid var(--border);border-radius:8px;padding:0 11px;font-size:12px;color:var(--text);font-family:var(--font);background:var(--surface);outline:none;transition:border-color 0.18s;}
.fg input:focus,.fg select:focus{border-color:var(--teal);}
.fg.flex-1{flex:1;min-width:180px;}
.ta{display:flex;gap:8px;margin-left:auto;align-items:flex-end;}

/* TABLE */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;}
.tch{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.tch h3{font-size:14px;font-weight:700;}
.cpill{background:rgba(0,180,172,0.12);color:var(--teal-dark);font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;border:1px solid rgba(0,180,172,0.2);}
table{width:100%;border-collapse:collapse;}
thead th{background:#F7FAFB;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;padding:11px 16px;text-align:left;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap;transition:background 0.14s;}
thead th:hover{background:#EEF4F8;color:var(--text);}
thead th .si{margin-left:4px;opacity:0.25;font-size:9px;}
thead th.sorted .si{opacity:1;color:var(--teal);}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:nth-child(even){background:#FAFCFF;}
tbody tr:hover{background:#F0FBF9;}
tbody td{padding:12px 16px;font-size:12px;vertical-align:middle;}
.td-nome{font-weight:600;}
.td-mut{color:var(--muted);}

/* Turma badges */
.turma-flow{display:flex;align-items:center;gap:8px;}
.pt-old{display:inline-block;background:#FEE2E2;color:#991B1B;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}
.arrow-icon{color:var(--muted);font-size:14px;}
.pt-new{display:inline-block;background:var(--green-bg);color:var(--green-ok);font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}

.abt{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;transition:all 0.14s;}
.abt:hover{background:var(--bg);border-color:var(--teal);}
.abt.del:hover{background:var(--red-bg);border-color:#FCA5A5;}
.empty{text-align:center;padding:60px;color:var(--muted);}
.empty p{font-size:13px;margin-top:8px;}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(10,25,50,0.55);z-index:200;display:none;align-items:center;justify-content:center;padding:22px;}
.backdrop.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;border:1px solid var(--border);overflow:hidden;animation:up 0.2s ease;}
@keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.mhdr{background:linear-gradient(90deg,var(--teal-deep),var(--blue-dark));padding:18px 22px;display:flex;align-items:center;justify-content:space-between;}
.mhdr h3{font-size:15px;font-weight:700;color:#fff;}
.mx{width:30px;height:30px;background:rgba(255,255,255,0.12);border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;}
.mx:hover{background:rgba(255,255,255,0.2);}
.mbody{padding:22px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg-f{display:flex;flex-direction:column;gap:5px;}
.fg-f.full{grid-column:1/-1;}
.fg-f label{font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);}
.fg-f input,.fg-f select,.fg-f textarea{border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);outline:none;transition:border-color 0.18s;width:100%;}
.fg-f input:focus,.fg-f select:focus,.fg-f textarea:focus{border-color:var(--teal);}
.fg-f textarea{resize:vertical;min-height:76px;}
.mfooter{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;background:#F8FAFB;}
.ferr{color:var(--red-err);font-size:11px;margin-top:8px;display:none;}

/* Preview de troca no modal */
.turma-preview{
  grid-column:1/-1;
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;
}
.preview-box{text-align:center;}
.preview-label{font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.preview-val{font-size:15px;font-weight:800;color:var(--text);}
.preview-arrow{font-size:22px;color:var(--teal);}

body.dark{
  --bg:#0F1923;--surface:#162030;--border:#1E2E42;
  --text:#E2EAF4;--muted:#5A7A9A;
  --teal-glow:rgba(0,180,172,0.10);
  --red-bg:rgba(229,57,53,0.12);
}
body.dark .topbar{background:var(--surface);border-color:var(--border);}
body.dark .toolbar{background:var(--surface);border-color:var(--border);}
body.dark .table-card{background:var(--surface);border-color:var(--border);}
body.dark thead th{background:#111D2A;color:var(--muted);}
body.dark thead th:hover{background:#162842;}
body.dark tbody tr:nth-child(even){background:#111D2A;}
body.dark tbody tr:hover{background:#0E2233;}
body.dark .tch{border-color:var(--border);}
body.dark .modal{background:var(--surface);border-color:var(--border);}
body.dark .mfooter{background:#111D2A;border-color:var(--border);}
body.dark .fg-f input,body.dark .fg-f select,body.dark .fg-f textarea{background:#111D2A;border-color:var(--border);color:var(--text);}
body.dark .fg input,body.dark .fg select{background:#111D2A;border-color:var(--border);color:var(--text);}
body.dark .btn-ghost{border-color:var(--border);color:var(--muted);}
body.dark .btn-ghost:hover{background:var(--bg);color:var(--text);}
body.dark .abt{border-color:var(--border);}
body.dark .abt:hover{background:var(--bg);}
body.dark .preview-box{background:var(--bg);border-color:var(--border);}
.dm-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all 0.18s;color:var(--muted);}
.dm-btn:hover{background:var(--bg);border-color:var(--teal);}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">🔄</div>
    <div class="sb-logo-text">
      <h1>Life System</h1>
      <p>Troca de Turmas</p>
    </div>
  </div>
  <nav class="sb-nav">
    <div class="sb-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4-4 4"/><path d="M3 7h18"/><path d="M7 21l-4-4 4-4"/><path d="M21 17H3"/></svg>
      Trocas de Turma
    </div>
  </nav>
  <div class="sb-back">
    <button class="btn-back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar ao Portal
    </button>
  </div>
</aside>

<div class="main-area">
  <div class="topbar">
    <div class="topbar-left">
      <h2>Troca de Turmas</h2>
      <p id="topDate"></p>
    </div>
    <div class="topbar-right"><button class="dm-btn" id="dmBtn" onclick="toggleDark()" title="Modo escuro">🌙</button>
      <button class="btn btn-teal" onclick="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Registrar Troca
      </button>
    </div>
  </div>

  <div class="content">


    <div class="toolbar">
      <div class="fg flex-1">
        <label>Buscar aluno</label>
        <input type="text" id="fSearch" placeholder="Nome do aluno..." oninput="applyFilters()">
      </div>
      <div class="fg">
        <label>Turma origem</label>
        <input type="text" id="fOrigem" placeholder="Ex.: 3º A" oninput="applyFilters()" style="min-width:120px">
      </div>
      <div class="fg">
        <label>Turma destino</label>
        <input type="text" id="fDestino" placeholder="Ex.: 5º B" oninput="applyFilters()" style="min-width:120px">
      </div>
      <div class="fg">
        <label>Data da troca</label>
        <input type="date" id="fDi" onchange="applyFilters()" style="min-width:130px">
      </div>
      <div class="ta">
        <button class="btn btn-ghost" onclick="clearFilters()">Limpar</button>
      </div>
    </div>

    <div class="table-card">
      <div class="tch">
        <h3>Registros de Troca</h3>
        <span class="cpill" id="cpill">0 registros</span>
      </div>
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('aluno')">Aluno <span class="si" id="si-aluno">▲</span></th>
            <th onclick="sortBy('turma_antiga')">Turma Origem <span class="si" id="si-turma_antiga">▲</span></th>
            <th onclick="sortBy('turma_nova')">Turma Destino <span class="si" id="si-turma_nova">▲</span></th>
            <th onclick="sortBy('data')">Data <span class="si" id="si-data">▲</span></th>
            <th onclick="sortBy('registrado_por')">Registrado por <span class="si" id="si-registrado_por">▲</span></th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="backdrop" id="backdrop" onclick="closeBackdrop(event)">
  <div class="modal">
    <div class="mhdr">
      <h3 id="mTitle">Registrar Troca de Turma</h3>
      <button class="mx" onclick="closeModal()">×</button>
    </div>
    <div class="mbody">
      <div class="fgrid">
        <div class="fg-f full">
          <label>Nome do Aluno *</label>
          <input type="text" id="mAluno" placeholder="Nome completo do aluno">
        </div>
        <div class="fg-f">
          <label>Turma Origem *</label>
          <input type="text" id="mOrigem" placeholder="Ex.: 3º A" oninput="updatePreview()">
        </div>
        <div class="fg-f">
          <label>Turma Destino *</label>
          <input type="text" id="mDestino" placeholder="Ex.: 5º B" oninput="updatePreview()">
        </div>

        <!-- Preview -->
        <div class="turma-preview" id="turmaPreview" style="display:none">
          <div class="preview-box">
            <div class="preview-label">Saindo de</div>
            <div class="preview-val" id="prevOrigem">—</div>
          </div>
          <div class="preview-arrow">→</div>
          <div class="preview-box">
            <div class="preview-label">Indo para</div>
            <div class="preview-val" id="prevDestino">—</div>
          </div>
        </div>

        <div class="fg-f">
          <label>Data *</label>
          <input type="date" id="mData">
        </div>
        <div class="fg-f">
          <label>Registrado por *</label>
          <input type="text" id="mReg" placeholder="Seu nome">
        </div>
        <div class="fg-f full">
          <label>Observações</label>
          <textarea id="mObs" placeholder="Motivo da troca, informações adicionais..."></textarea>
        </div>
      </div>
      <p class="ferr" id="ferr">Preencha todos os campos obrigatórios (*).</p>
    </div>
    <div class="mfooter">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-teal" onclick="saveRecord()">Salvar Registro</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL='https://bcotbawygyqlqrvgtzos.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjb3RiYXd5Z3lxbHFydmd0em9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzQ4MzUsImV4cCI6MjA5MTkxMDgzNX0.qGXnTn6Ef3g0LfuU9LaMKHeAv2W8NeyiwUqIynu_FqU';
const headers={'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};

let records=[],filtered=[],sortCol='data',sortDir=-1,editId=null;

async function load(){
  document.getElementById('topDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('tBody').innerHTML=`<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">Carregando...</td></tr>`;
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/troca_turmas?select=*&order=data.desc`,{headers});
    records=await res.json();
    if(!Array.isArray(records))records=[];
  }catch(e){records=[];}
  populateSels();applyFilters();
}

async function saveToDb(rec,isEdit){
  if(isEdit){
    await fetch(`${SUPA_URL}/rest/v1/troca_turmas?id=eq.${rec.id}`,{
      method:'PATCH',headers:{...headers,'Prefer':'return=minimal'},
      body:JSON.stringify({aluno:rec.aluno,turma_antiga:rec.turma_antiga,turma_nova:rec.turma_nova,data:rec.data,registrado_por:rec.registrado_por,obs:rec.obs})
    });
  }else{
    await fetch(`${SUPA_URL}/rest/v1/troca_turmas`,{
      method:'POST',headers:{...headers,'Prefer':'return=minimal'},
      body:JSON.stringify({aluno:rec.aluno,turma_antiga:rec.turma_antiga,turma_nova:rec.turma_nova,data:rec.data,registrado_por:rec.registrado_por,obs:rec.obs})
    });
  }
  await load();
}

function populateSels(){
  const origens=[...new Set(records.map(r=>r.turma_antiga))].sort();
  const destinos=[...new Set(records.map(r=>r.turma_nova))].sort();
  ['fOrigem'].forEach(id=>{
    const el=document.getElementById(id),v=el.value;
    el.innerHTML='<option value="">Todas</option>';
    origens.forEach(t=>{const o=document.createElement('option');o.value=o.textContent=t;el.appendChild(o);});
    el.value=v;
  });
  ['fDestino'].forEach(id=>{
    const el=document.getElementById(id),v=el.value;
    el.innerHTML='<option value="">Todas</option>';
    destinos.forEach(t=>{const o=document.createElement('option');o.value=o.textContent=t;el.appendChild(o);});
    el.value=v;
  });
}

function applyFilters(){
  const q=document.getElementById('fSearch').value.toLowerCase();
  const ori=document.getElementById('fOrigem').value;
  const dest=document.getElementById('fDestino').value;
  const df=document.getElementById('fDi').value;
  filtered=records.filter(r=>{
    if(q&&!r.aluno.toLowerCase().includes(q))return false;
    if(ori&&!r.turma_antiga.toLowerCase().includes(ori.toLowerCase()))return false;
    if(dest&&!r.turma_nova.toLowerCase().includes(dest.toLowerCase()))return false;
    if(df&&r.data!==df)return false;
    return true;
  });
  doSort();renderTable();updateStats();
}

function sortBy(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}
  document.querySelectorAll('.si').forEach(e=>{e.style.opacity='0.25';e.style.color='';});
  const ic=document.getElementById('si-'+col);
  if(ic){ic.style.opacity='1';ic.style.color='var(--teal)';ic.textContent=sortDir===1?'▲':'▼';}
  doSort();renderTable();
}
function doSort(){filtered.sort((a,b)=>{let av=a[sortCol]||'',bv=b[sortCol]||'';return av<bv?-sortDir:av>bv?sortDir:0;});}
function fmt(d){if(!d)return'—';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}

function renderTable(){
  const tb=document.getElementById('tBody');
  document.getElementById('cpill').textContent=filtered.length+(filtered.length===1?' registro':' registros');
  if(!filtered.length){
    tb.innerHTML=`<tr><td colspan="7"><div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>Nenhum registro encontrado</p></div></td></tr>`;
    return;
  }
  tb.innerHTML=filtered.map(r=>`
    <tr>
      <td class="td-nome">${r.aluno}</td>
      <td>
        <div class="turma-flow">
          <span class="pt-old">${r.turma_antiga}</span>
          <span class="arrow-icon">→</span>
          <span class="pt-new">${r.turma_nova}</span>
        </div>
      </td>
      <td style="display:none"></td>
      <td class="td-mut">${fmt(r.data)}</td>
      <td class="td-mut">${r.registrado_por||'—'}</td>
      <td class="td-mut" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.obs||''}">${r.obs||'—'}</td>
      <td><button class="abt" onclick="editRec(${r.id})" title="Editar">✏️</button> <button class="abt del" onclick="delRec(${r.id})" title="Excluir">🗑️</button></td>
    </tr>`).join('');
}

function updateStats(){
  const agora=new Date();
  const mes=records.filter(r=>{
    if(!r.data)return false;
    const d=new Date(r.data);
    return d.getMonth()===agora.getMonth()&&d.getFullYear()===agora.getFullYear();
  }).length;
  const turmas=new Set([...records.map(r=>r.turma_antiga),...records.map(r=>r.turma_nova)]).size;
  document.getElementById('stTotal').textContent=records.length;
  document.getElementById('stMes').textContent=mes;
  document.getElementById('stTurmas').textContent=turmas;
}

function clearFilters(){
  ['fSearch','fOrigem','fDestino','fDi'].forEach(id=>document.getElementById(id).value='');
  applyFilters();
}

function updatePreview(){
  const o=document.getElementById('mOrigem').value;
  const d=document.getElementById('mDestino').value;
  const prev=document.getElementById('turmaPreview');
  if(o||d){
    prev.style.display='flex';
    document.getElementById('prevOrigem').textContent=o||'—';
    document.getElementById('prevDestino').textContent=d||'—';
  }else{
    prev.style.display='none';
  }
}

function openModal(){
  editId=null;document.getElementById('mTitle').textContent='Registrar Troca de Turma';
  ['mAluno','mReg','mObs'].forEach(id=>document.getElementById(id).value='');
  ['mOrigem','mDestino'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mData').value=new Date().toISOString().split('T')[0];
  document.getElementById('turmaPreview').style.display='none';
  document.getElementById('ferr').style.display='none';
  document.getElementById('backdrop').classList.add('open');
}

function editRec(id){
  const r=records.find(x=>x.id===id);if(!r)return;editId=id;
  document.getElementById('mTitle').textContent='Editar Registro';
  document.getElementById('mAluno').value=r.aluno;
  document.getElementById('mOrigem').value=r.turma_antiga;
  document.getElementById('mDestino').value=r.turma_nova;
  document.getElementById('mData').value=r.data;
  document.getElementById('mReg').value=r.registrado_por||'';
  document.getElementById('mObs').value=r.obs||'';
  document.getElementById('ferr').style.display='none';
  updatePreview();
  document.getElementById('backdrop').classList.add('open');
}

async function saveRecord(){
  const aluno=document.getElementById('mAluno').value.trim();
  const origem=document.getElementById('mOrigem').value;
  const destino=document.getElementById('mDestino').value;
  const data=document.getElementById('mData').value;
  const reg=document.getElementById('mReg').value.trim();
  if(!aluno||!origem||!destino||!data||!reg){document.getElementById('ferr').style.display='block';return;}
  if(origem===destino){document.getElementById('ferr').textContent='Turma origem e destino não podem ser iguais.';document.getElementById('ferr').style.display='block';return;}
  const rec={id:editId||null,aluno,turma_antiga:origem,turma_nova:destino,data,registrado_por:reg,obs:document.getElementById('mObs').value.trim()};
  closeModal();
  await saveToDb(rec,!!editId);
}

async function delRec(id){
  if(!confirm('Excluir este registro?'))return;
  await fetch(`${SUPA_URL}/rest/v1/troca_turmas?id=eq.${id}`,{method:'DELETE',headers});
  await load();
}

function closeModal(){document.getElementById('backdrop').classList.remove('open');}
function closeBackdrop(e){if(e.target===document.getElementById('backdrop'))closeModal();}

load();

function toggleDark(){
  const isDark=document.body.classList.toggle('dark');
  document.getElementById('dmBtn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('genesis_dark',isDark?'1':'0');
}
(function(){
  if(localStorage.getItem('genesis_dark')==='1'){
    document.body.classList.add('dark');
    document.addEventListener('DOMContentLoaded',function(){
      const b=document.getElementById('dmBtn');if(b)b.textContent='☀️';
    });
  }
})();
</script>
</body>
</html>
