<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armários — Life System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#00B4AC;--teal-dark:#009E96;--teal-deep:#007B74;
  --orange:#F5A623;--blue-dark:#1B3F72;--blue-mid:#2D6BE4;
  --green:#27AE60;--green-bg:#E9F8EF;
  --red:#E53935;--red-bg:#FDECEA;
  --bg:#F0F4F8;--surface:#fff;--border:#E4EAF2;
  --text:#1A2535;--muted:#7B8FAB;
  --font:'Plus Jakarta Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);min-height:100vh;}

/* HEADER */
header{background:linear-gradient(135deg,#00C9C1,#007B74 50%,#1B3F72);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--teal);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-icon{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.header-left h1{font-size:16px;font-weight:700;color:#fff;}
.header-left p{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.07em;}
.header-right{display:flex;align-items:center;gap:12px;}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.65);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;}
.sync-dot.syncing{background:transparent;border:2px solid var(--orange);border-top-color:transparent;border-radius:50%;width:10px;height:10px;animation:spin 0.8s linear infinite;}
.sync-dot.error{background:var(--red);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-portal{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:var(--font);transition:all 0.18s;text-decoration:none;}
.btn-portal:hover{background:rgba(255,255,255,0.22);}

/* STATS */
.stats-bar{display:flex;gap:14px;padding:20px 28px;flex-wrap:wrap;}
.stat-card{background:var(--surface);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:12px;flex:1;min-width:130px;border:1px solid var(--border);border-top:3px solid var(--teal);transition:transform 0.2s;}
.stat-card:hover{transform:translateY(-2px);}
.stat-card:nth-child(2){border-top-color:var(--green);}
.stat-card:nth-child(3){border-top-color:var(--red);}
.stat-card:nth-child(4){border-top-color:var(--orange);}
.stat-icon{font-size:1.6rem;}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--text);}
.stat-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;padding:0 28px 18px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:200px;position:relative;}
.search-box input{width:100%;height:38px;padding:0 16px 0 40px;border:1.5px solid var(--border);border-radius:9px;font-family:var(--font);font-size:13px;outline:none;background:var(--surface);transition:border-color 0.2s;color:var(--text);}
.search-box input:focus{border-color:var(--teal);}
.search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.filter-btn{height:38px;padding:0 16px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s;color:var(--muted);}
.filter-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.filter-btn.active-green{background:var(--green);border-color:var(--green);color:#fff;}
.filter-btn.active-red{background:var(--red);border-color:var(--red);color:#fff;}

/* GRID */
.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px;padding:0 28px 40px;}
.locker-card{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer;border:2px solid var(--border);}
.locker-card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 10px 28px rgba(0,0,0,0.13);}
.locker-card.occupied{border-color:var(--teal);}
.locker-card.empty{border-color:var(--border);}
.locker-card.hidden{display:none;}
.locker-top{height:86px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative;}
.locker-card.occupied .locker-top{background:linear-gradient(135deg,rgba(0,180,172,0.12),rgba(27,63,114,0.1));}
.locker-card.empty .locker-top{background:var(--bg);}
.locker-number{position:absolute;top:8px;left:9px;font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,0.9);border-radius:7px;padding:2px 7px;border:1px solid var(--border);}
.status-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;border:2px solid white;}
.locker-card.occupied .status-dot{background:var(--teal);}
.locker-card.empty .status-dot{background:#D1D5DB;}
.locker-body{padding:11px 13px 13px;}
.locker-name{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.locker-empty-label{font-weight:600;font-size:12px;color:var(--muted);margin-bottom:3px;}
.locker-password{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.pw-dots{letter-spacing:2px;color:#9CA3AF;}
.pw-toggle{cursor:pointer;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(0,180,172,0.1);color:var(--teal);font-weight:700;transition:background 0.15s;}
.pw-toggle:hover{background:var(--teal);color:white;}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(240,244,248,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;}
.loading-overlay.hidden{display:none;}
.loading-spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite;}
.loading-text{font-size:13px;font-weight:600;color:var(--muted);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,25,50,0.55);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;width:90%;max-width:420px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.2);animation:popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{background:linear-gradient(90deg,var(--teal-deep),var(--blue-dark));padding:18px 22px;display:flex;align-items:center;justify-content:space-between;}
.modal-header h2{font-size:16px;font-weight:700;color:#fff;}
.modal-close{background:rgba(255,255,255,0.12);border:none;border-radius:7px;width:30px;height:30px;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,0.22);}
.modal-subtitle{font-size:12px;color:var(--muted);padding:12px 22px 0;font-weight:500;}
.modal-body{padding:16px 22px 22px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;}
.form-group input{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;outline:none;transition:border-color 0.2s;color:var(--text);font-weight:500;}
.form-group input:focus{border-color:var(--teal);}
.modal-actions{display:flex;gap:9px;margin-top:18px;}
.btn-save{flex:1;height:40px;background:var(--teal);color:#fff;border:none;border-radius:9px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.18s;}
.btn-save:hover{background:var(--teal-dark);}
.btn-save:disabled{opacity:0.6;cursor:not-allowed;}
.btn-clear{height:40px;padding:0 16px;background:var(--red-bg);color:var(--red);border:none;border-radius:9px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.18s;}
.btn-clear:hover{background:var(--red);color:#fff;}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:white;padding:11px 22px;border-radius:50px;font-weight:600;font-size:13px;z-index:9999;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  header{padding:0 16px;}
  .stats-bar,.toolbar,.grid-container{padding-left:16px;padding-right:16px;}
  .grid-container{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;}
}

body.dark{
  --bg:#0F1923;--surface:#162030;--border:#1E2E42;
  --text:#E2EAF4;--muted:#5A7A9A;
  --teal-glow:rgba(0,180,172,0.10);
  --red-bg:rgba(229,57,53,0.12);
}
body.dark .stat-card{background:var(--surface);border-color:var(--border);}
body.dark .search-box input{background:var(--surface);border-color:var(--border);color:var(--text);}
body.dark .filter-btn{background:var(--surface);border-color:var(--border);color:var(--muted);}
body.dark .locker-card{background:var(--surface);border-color:var(--border);}
body.dark .locker-card.empty .locker-top{background:#111D2A;}
body.dark .locker-number{background:rgba(22,32,48,0.9);border-color:var(--border);color:var(--muted);}
body.dark .modal{background:var(--surface);}
body.dark .form-group input{background:#111D2A;border-color:var(--border);color:var(--text);}
body.dark .toast{background:#E2EAF4;color:#0F1923;}
body.dark .locker-name{color:var(--text);}
body.dark .locker-empty-label{color:var(--muted);}
.dm-btn{width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.18s;color:#fff;}
.dm-btn:hover{background:rgba(255,255,255,0.22);}
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando armários...</div>
</div>

<header>
  <div class="header-left">
    <div class="header-icon">🔐</div>
    <div>
      <h1>Armários</h1>
      <p>Life System</p>
    </div>
  </div>
  <div class="header-right">
    <div class="sync-indicator">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-label">Conectando...</span>
    </div>
    <button class="dm-btn" id="dmBtn" onclick="toggleDark()" title="Modo escuro">🌙</button> <a href="index.html" class="btn-portal">← Voltar ao Portal</a>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-card"><div class="stat-icon">🗄️</div><div><div class="stat-num">32</div><div class="stat-label">Total</div></div></div>
  <div class="stat-card"><div class="stat-icon">✅</div><div><div class="stat-num" id="stat-occupied">0</div><div class="stat-label">Ocupados</div></div></div>
  <div class="stat-card"><div class="stat-icon">🔓</div><div><div class="stat-num" id="stat-empty">32</div><div class="stat-label">Livres</div></div></div>
  <div class="stat-card"><div class="stat-icon">📊</div><div><div class="stat-num" id="stat-pct">0%</div><div class="stat-label">Uso</div></div></div>
</div>

<div class="toolbar">
  <div class="search-box"><input type="text" id="search-input" placeholder="Buscar aluno ou armário..." oninput="renderGrid()"></div>
  <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
  <button class="filter-btn" onclick="setFilter('occupied',this)">Ocupados</button>
  <button class="filter-btn" onclick="setFilter('free',this)">Livres</button>
</div>

<div class="grid-container" id="locker-grid"></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalIfOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Armário</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <p class="modal-subtitle" id="modal-subtitle"></p>
    <div class="modal-body">
      <div class="form-group"><label>Número do Armário</label><input type="text" id="input-numero" placeholder="Ex: 27, 28..." autocomplete="off"></div>
      <div class="form-group"><label>Nome do Aluno</label><input type="text" id="input-name" placeholder="Ex: Maria Souza" autocomplete="off"></div>
      <div class="form-group"><label>Turma</label><input type="text" id="input-turma" placeholder="Ex: 6B" autocomplete="off"></div>
      <div class="form-group"><label>Senha</label><input type="text" id="input-password" placeholder="Ex: 1234" autocomplete="off"></div>
      <div class="modal-actions">
        <button class="btn-save" id="btn-save" onclick="saveLocker()">💾 Salvar</button>
        <button class="btn-clear" onclick="clearLocker()">🗑️ Limpar</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://zwrgyaujzizgoihgdehg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3cmd5YXVqeml6Z29paGdkZWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3OTA1MTYsImV4cCI6MjA4ODM2NjUxNn0.pBskASoLg5lHVoOnQR8OLXJOQ9eCzOX5By05dqiH37g';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const EMOJIS = ['📚','🎒','✏️','📐','🖊️','📓','🎨','🔭','🧪','📏','🎯','🖍️','📌','📎','✂️','🗂️','📋','📖','🖋️','🎓','🖌️','📝','🔬','🧲','🎵','🏅','🌟','💡','🧩','📡','🗃️','🎓'];

let lockers = [];
let currentLocker = null;
let currentFilter = 'all';

function setSyncStatus(s) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot' + (s==='syncing'?' syncing':s==='error'?' error':'');
  lbl.textContent = s==='ok'?'Conectado':s==='syncing'?'Salvando...':'Erro!';
}

async function initDB() {
  try {
    let { data, error } = await db.from('armarios').select('*').order('id');
    if (error || !data || data.length === 0) {
      const rows = Array.from({length:32},(_,i)=>({
        id:i+1,
        name: i===27 ? 'Sofia Cruz e Isabella Oliveira' : '',
        turma: i===27 ? '6B' : '',
        password: ''
      }));
      await db.from('armarios').upsert(rows);
      data = rows;
    }
    lockers = data.map((r,i)=>({...r, emoji:EMOJIS[i]}));
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    showToast('❌ Erro de conexão com o banco!');
  }
  document.getElementById('loading-overlay').classList.add('hidden');
  renderGrid();
}

function updateStats() {
  const occ = lockers.filter(l=>l.name&&l.name.trim()).length;
  document.getElementById('stat-occupied').textContent = occ;
  document.getElementById('stat-empty').textContent = 32-occ;
  document.getElementById('stat-pct').textContent = Math.round(occ/32*100)+'%';
}

function renderGrid() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const grid = document.getElementById('locker-grid');
  grid.innerHTML = '';
  lockers.forEach(l => {
    const occ = l.name && l.name.trim()!=='';
    const matchS = (l.name||'').toLowerCase().includes(query)||String(l.id).includes(query)||(l.numero||'').includes(query);
    const matchF = currentFilter==='all'||(currentFilter==='occupied'&&occ)||(currentFilter==='free'&&!occ);
    const card = document.createElement('div');
    card.className = `locker-card ${occ?'occupied':'empty'} ${(!matchS||!matchF)?'hidden':''}`;
    card.onclick = ()=>openModal(l.id);
    card.innerHTML = `
      <div class="locker-top">
        <span class="locker-number">${l.numero ? '🔢'+l.numero : '#'+l.id}</span>
        <span>${occ?l.emoji:'🔓'}</span>
        <span class="status-dot"></span>
      </div>
      <div class="locker-body">
        ${occ?`
          <div class="locker-name" title="${l.name}">${l.name}</div>
          ${l.turma?`<div style="font-size:0.72rem;color:var(--purple);font-weight:700;margin-bottom:3px;">🏫 Turma ${l.turma}</div>`:''}
          <div class="locker-password">
            🔑 <span class="pw-text pw-dots" data-id="${l.id}">${l.password?'••••':'sem senha'}</span>
            ${l.password?`<span class="pw-toggle" onclick="togglePw(event,${l.id})">ver</span>`:''}
          </div>
        `:`
          <div class="locker-empty-label">Livre</div>
          <div style="font-size:0.75rem;color:#9CA3AF;">Clique para atribuir</div>
        `}
      </div>`;
    grid.appendChild(card);
  });
  updateStats();
}

function togglePw(e,id) {
  e.stopPropagation();
  const l = lockers.find(x=>x.id===id);
  const span = document.querySelector(`.pw-text[data-id="${id}"]`);
  const btn = e.target;
  if(span.classList.contains('pw-dots')){
    span.textContent=l.password||'—'; span.classList.remove('pw-dots'); btn.textContent='ocultar';
  } else {
    span.textContent='••••'; span.classList.add('pw-dots'); btn.textContent='ver';
  }
}

function openModal(id) {
  currentLocker = id;
  const l = lockers.find(x=>x.id===id);
  document.getElementById('modal-title').textContent = `Armário #${id}`;
  document.getElementById('modal-subtitle').textContent = l.name?`Atribuído a ${l.name}`:'Armário livre — preencha para atribuir';
  document.getElementById('input-numero').value = l.numero||'';
  document.getElementById('input-name').value = l.name||'';
  document.getElementById('input-turma').value = l.turma||'';
  document.getElementById('input-password').value = l.password||'';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('input-name').focus(),200);
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); currentLocker=null; }
function closeModalIfOutside(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }

async function saveLocker() {
  const numero = document.getElementById('input-numero').value.trim();
  const name = document.getElementById('input-name').value.trim();
  const turma = document.getElementById('input-turma').value.trim();
  const password = document.getElementById('input-password').value.trim();
  const btn = document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='⏳ Salvando...';
  setSyncStatus('syncing');
  const {error} = await db.from('armarios').upsert({id:currentLocker,numero,name,turma,password});
  if(error){ setSyncStatus('error'); showToast('❌ Erro ao salvar!'); }
  else {
    const l = lockers.find(x=>x.id===currentLocker);
    l.numero=numero; l.name=name; l.turma=turma; l.password=password;
    setSyncStatus('ok'); closeModal(); renderGrid();
    showToast(name?`✅ "${name}" salvo no armário #${currentLocker}!`:`🔓 Armário #${currentLocker} liberado!`);
  }
  btn.disabled=false; btn.innerHTML='💾 Salvar';
}

async function clearLocker() {
  if(!confirm(`Limpar o armário #${currentLocker}?`)) return;
  setSyncStatus('syncing');
  const {error} = await db.from('armarios').upsert({id:currentLocker,numero:'',name:'',turma:'',password:''});
  if(error){ setSyncStatus('error'); showToast('❌ Erro ao limpar!'); }
  else {
    const l = lockers.find(x=>x.id===currentLocker);
    l.numero=''; l.name=''; l.turma=''; l.password='';
    setSyncStatus('ok'); closeModal(); renderGrid();
    showToast(`🗑️ Armário #${currentLocker} esvaziado`);
  }
}

function setFilter(type,btn) {
  currentFilter=type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active','active-green','active-red'));
  if(type==='all') btn.classList.add('active');
  else if(type==='occupied') btn.classList.add('active-green');
  else btn.classList.add('active-red');
  renderGrid();
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// Atualiza a cada 30 segundos automaticamente
setInterval(async()=>{
  const {data}=await db.from('armarios').select('*').order('id');
  if(data){lockers=data.map((r,i)=>({...r,emoji:EMOJIS[i]}));renderGrid();}
},30000);

initDB();

function toggleDark(){
  const isDark=document.body.classList.toggle('dark');
  document.getElementById('dmBtn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('genesis_dark',isDark?'1':'0');
}
(function(){
  if(localStorage.getItem('genesis_dark')==='1'){
    document.body.classList.add('dark');
    const b=document.getElementById('dmBtn');if(b)b.textContent='☀️';
  }
})();
</script>
